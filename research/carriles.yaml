# Carriles de candidatas en simulado (F4). Fuente única; la lee lab.lanes.
# Una candidata que pasa su barra entra a un carril, no al piloto: corre contra el control en los
# mismos días y con las mismas funciones de lab.portfolio (lab.paper_comparison), en su propia base.
# Ojo: paper_comparison simula con comisión y deslizamiento fijos del plan, no contra el libro de
# Bitso; medir el costo real por operación de una candidata necesita extenderlo (S04).
# Activar un carril exige plan preregistrado (commit propio) y un DEC. No cambia el piloto.
version: 1
max_activos: 2
capital_usd: 500
nota: >-
  carril-1 activo desde el 30-oct-2026 (H10, Donchian 55/20; DEC-037). Corre como ejecutor separado en la Mac de
  Brandon (tarea programada diaria) con su base en «Trading Lab/carriles/carril-1», no dentro de Railway: ahí el gate
  exigiría fijar TRADING_LAB_BUILD_ID en cada despliegue. carril-2 sigue vacío (candidato: H1b, sprint 03).
carriles:
  - id: carril-1
    estado: activo
    hipotesis: 'H10 — ruptura Donchian 55/20, partes iguales, sin régimen BTC (catalogo100: donchian-55-20-equal)'
    plan: configs/experiments/donchian_lane_v1.yaml
    preregistro_commit: 405c3c2d6ba5f554b2f594d71f5fbb4530987362
    desde: '2026-10-30'
    ejecutor: mac
    datos: 'Trading Lab/carriles/carril-1 (vault, fuera del repo)'
  - id: carril-2
    estado: vacio
    hipotesis: null
    plan: null
    preregistro_commit: null
    desde: null
