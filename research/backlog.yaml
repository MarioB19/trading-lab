# Backlog de hipótesis de Trading Lab: fuente única.
# La nota del vault «00 — Dirección/🧪 Backlog de hipótesis — Trading Lab.md» se genera desde aquí:
#   python -m lab.backlog render --out "<vault>/00 — Dirección/🧪 Backlog de hipótesis — Trading Lab.md"
# El panel (pestaña Investigación) lee este mismo archivo. Validar: python -m lab.backlog check
version: 1
actualizado: '2026-10-31'
nota:
  tags: [proyecto, trading, investigación, hipótesis]
  estado: activo

intro: >-
  Lista única de ideas por probar, ordenada por impacto esperado. La skill `trading-lab-investigacion`
  toma de aquí la de arriba en cada sprint semanal, la preregistra, la prueba y anota el resultado. Una
  idea descartada se queda en la tabla de abajo con su motivo: no se vuelve a probar sin un dato nuevo.

barras: |-
  **Dos tipos de cambio, dos barras** (detalle en `trading-lab/AGENTS.md`, regla 3):
  - **Costo:** misma señal, menos fricción. Gana si mejora el neto en la mayoría de los años del walk-forward, el bootstrap de la diferencia neta es > 0 con 90% de confianza, la caída máxima no empeora más de 2 puntos y aguanta costos ×1.5.
  - **Señal:** se afirma una ventaja nueva. Walk-forward, placebo p < 0.05, bootstrap contra el control, Sharpe deflactado y costos ×1.5.

por_que_el_orden: >-
  El bloque cripto paga ~37 pb por movimiento en Bitso (0.30% maker, 0.36% taker) y en el backtest los
  costos se comen ≈12% del capital al año. La forma más segura de mejorar el neto es pagar menos fricción
  con la misma señal. Las ideas de "más señal" van después, y solo si superan costos con margen.

# tipo: costo | señal | externo | infra | otro. `estado` es el texto que se muestra tal cual.
hipotesis:
  - id: H4
    orden: 4
    tipo: costo
    titulo: Más órdenes maker
    idea: Subir la parte maker (hoy 24% por importe) baja el costo por movimiento sin cambiar qué se opera
    evidencia: >-
      30 días: 33 operaciones, 37 pb, 24% maker. Sprint 01: con la misma señal, abaratar cada operación es
      la palanca más limpia
    prueba: >-
      Sprint 02: análisis de fills (18 con dato: 6 maker en 36–105 s a 29 pb; 12 agotaron los 120 s y fueron a
      mercado a 39 pb). No se puede backtestear. Prueba hacia adelante preregistrada: `execution.wait_s` 120 → 300 s,
      4 semanas, éxito si ≥ 50% maker por importe y costo ≤ 33 pb
    estado: '🔬 Prueba hacia adelante activa desde el 25-oct (DEC-034): wait_s 300 s, presupuesto 600 s por ciclo; se evalúa a las 4 semanas'
  - id: H2
    orden: 6
    tipo: costo
    titulo: Orden mínima de US$20–25
    idea: >-
      No ejecutar ajustes menores a US$20–25: las órdenes de ~US$10 cuestan 27–38 pb y casi no cambian el
      riesgo
    evidencia: Fills del 10–14 oct (SOL, LINK de ~US$10)
    prueba: >-
      Sprint 02: simulador con efectivo, US$500 cada 1 de enero 2021–2026, `min_order_value` 5 / 20 / 25.
      US$25: +41.0% anual contra +36.2%, caída −33.7% contra −36.6%, bootstrap 0.971 (umbral 0.967). US$20 no
      concluyente (0.599). El ahorro de costo es ≈1 punto; el resto es efecto de camino, vecindad consistente
      entre US$24 y US$30
    estado: '✅ Aprobada (sprint 02). En el piloto desde el 25-oct con orden mínima de US$25 (DEC-033); revisión a las 4 semanas'
  - id: H1b
    orden: 1
    tipo: costo
    titulo: No recomprar en 48 h
    idea: Cortar las recompras en menos de 48 h (7 en 30 días) con un periodo de espera tras vender
    evidencia: Revisión del 25-oct; V1 del sprint 01 fue la mejor variante, aunque no concluyente
    prueba: Backtest con «no recomprar en 2 días» contra el control
    estado: ⏳ Siguiente (sprint 03, 8-nov)
  - id: H7
    orden: 2
    tipo: externo
    titulo: Comisión menor (otro exchange)
    idea: >-
      Una comisión menor cambia todo el cálculo: con 0.10% por lado, el costo anual del control bajaría de
      ~11% a ~4–5%
    evidencia: >-
      Bitso USD 0.30%/0.36% (MXN 0.60%/0.78%); Binance 0.10% (0.075% con BNB); Kraken Pro 0.40%/0.80% por
      debajo de US$2,500 al mes, peor que Bitso a este tamaño. Bitso no tiene pares de altcoins contra BTC
    prueba: >-
      Simular el control con la comisión de cada opción y el spread medido. **La elección de exchange para
      dinero real es decisión de Brandon** (regulación, depósitos en pesos, custodia)
    estado: >-
      Simulado el 25-oct (`reports/h7_exchanges_informe.md`): con 0.10% por lado el control rinde +53.7% anual contra
      +42.7% y la caída máxima baja de −37% a −28%; costo anual 3.7% contra 11%. Operar en pesos en Bitso (0.78%) activa
      el kill switch. Falta la decisión de Brandon (regulación, pesos, custodia) y 4 semanas en simulado contra el libro
      del exchange elegido
  - id: H8
    orden: 5
    tipo: costo
    titulo: Efectivo con rendimiento
    idea: >-
      El efectivo ocioso del bloque cripto (~34% en promedio) rendiría ~4% anual en bonos del Tesoro de
      corto plazo o equivalente, sin cambiar la señal
    evidencia: 'Exposición del bloque: 66% el 24-oct; `PortfolioParams.cash_asset` ya existe (BIL)'
    prueba: >-
      Sprint 02: T-bill a 3 meses (FRED DTB3) menos 25% sobre el efectivo del control: +44.5% contra +42.7% anual, 6
      de 6 años, caída 1.9 puntos menor, bootstrap 1.00. Con la tasa de hoy (4.0%) y 67% de efectivo promedio vale
      ≈+2 puntos al año
    estado: >-
      Aprobada en backtest; falta dato para operarla: tasa real de la plataforma sobre el efectivo ocioso (Bitso+ paga
      sobre stablecoins en USD, no sobre USD), retiro inmediato y costo de mover. Se resuelve junto con H7 (exchange)
  - id: H10
    orden: 7
    tipo: señal
    titulo: Carril hacia adelante para Donchian 55/20
    idea: >-
      La ruptura Donchian 55/20 con pesos iguales rindió +53% anual contra +38% del control en 2019–2026 con la mitad de
      rotación, pero su ventaja está en 2023 y no sobrevive la corrección por 101 comparaciones (p 0.69). ¿Sostiene algo
      hacia adelante, en los mismos días que el control?
    evidencia: Catálogo 100 (30-oct), `reports/catalogo100_resultado.md`
    prueba: >-
      Carril en simulado (`research/carriles.yaml`, `lab.lanes`) 4 semanas contra el control; requiere reimplementar la
      regla en `lab.portfolio` con prueba de sin mirar al futuro y un DEC. No cambia el piloto
    estado: >-
      🔬 Carril activo desde el 30-oct-2026 (DEC-037): Brandon lo aprobó; plan `configs/experiments/donchian_lane_v1.yaml`
      (preregistro `405c3c2d…`), ejecutor separado en la Mac con código congelado y base en «Trading Lab/carriles/carril-1»
      (`scripts/lanes/run_carril.sh`). Falta que la observación diaria quede en una tarea programada (ver
      `docs/CARRIL_1_TAREA.md`); 28 días observados → revisión humana
  - id: H11
    orden: 9
    tipo: costo
    titulo: Banda de 10 pp en el bloque de ETFs
    idea: >-
      Rebalancear el 60/40 solo cuando un ETF se desvía 10 puntos (hoy 5) deja correr al que sube: +9.0% contra +8.5% anual,
      caída −29.6% contra −31.2%, 10 de 17 años, p sin corregir 0.01 en el Catálogo 2 (no pasó la corrección familiar)
    evidencia: Catálogo 2 (31-oct), `reports/catalogo2_etf_resultado.md`, variante `control-band-10`
    prueba: Sprint de costo propio con su barra (mayoría de años, bootstrap de rendimiento ≥ 0.90, caída no peor por 2 pts, estrés)
    estado: Pendiente (sale del Catálogo 2)
  - id: H12
    orden: 10
    tipo: otro
    titulo: Kill switch del bloque de ETFs (−25%) habría apagado al 60/40 en 2008
    idea: >-
      El 60/40 vigente cayó −31% en 2008–2009; con el kill switch de −25% el bloque se habría quedado en efectivo hasta
      rearmarlo a mano. 27 de 53 variantes también lo tocan. Decisión de riesgo para Brandon: subir el kill (p. ej. −35%),
      aceptar el apagado, o pasar a una variante de menor caída (freno 5–20: −23% con 8.1%; vol objetivo 10%: −20% con 7.5%)
    evidencia: Catálogo 2 (31-oct), `reports/catalogo2_etf_resultado.md`
    prueba: No es una estrategia; es una decisión de Brandon. Si elige una variante de menor caída, preregistro con barra de costo
    estado: Propuesta a Brandon (31-oct)
  - id: H6
    orden: 3
    tipo: costo
    titulo: Universo de ~8 monedas
    idea: Universo líquido de ~8 monedas en vez de 16 reduce el spread pagado
    evidencia: >-
      Costos por moneda en `execution-quality`. Sprint 02 (30 días): LTC 43 pb de promedio con 22 pb de spread, LINK 30 pb
      con 22 pb de spread, NEAR 55 pb; BTC y ETH 33 pb con spread de 1–2 pb
    prueba: Medir costo por activo en el piloto y backtest con el universo recortado
    estado: >-
      Pendiente. Dato nuevo (30-oct): el piloto compró TRX por US$118.89 (40% del bloque) con spread de 2.4% y 165 pb
      de costo, la única orden con aviso de liquidez; un filtro de spread o liquidez por moneda se evaluaría aquí
  - id: H5
    orden: 8
    tipo: señal
    titulo: Referencia simple
    idea: Una referencia simple iguala a la táctica neta de costos con mucha menos rotación
    evidencia: >-
      Sprint 01: BTC comprar y mantener rinde +49% anual con caída de −77%; BTC con filtro de 200 días +37%
      con −52%; el control +43% con −37%. Hoy el control gana en riesgo
    prueba: Solo si cambia el panorama
    estado: En pausa
    pausada: true

descartadas:
  - idea: Táctica en ETFs
    motivo: 4.5% anual vs 9.9% del 60/40; timing = azar (p = 0.34)
    fuente: '`reports/multi_informe.md`'
  - idea: Multi-mercado en ETFs
    motivo: −1.4% anual; falló los 5 criterios
    fuente: '`reports/multi_market_informe.md`'
  - idea: Operar cada hora o cada 4 h
    motivo: −8.3% / 12.9% anual vs 21.6% del diario, por costos
    fuente: '`reports/tiempo_real_informe.md`'
  - idea: Reversión y ruptura de corto plazo
    motivo: Pierden con 0.45% por operación; requieren costos < 0.15–0.18%
    fuente: '`reports/corto_plazo_informe.md`'
  - idea: Agresiva top 3 / volatilidad 60%
    motivo: Falló siete criterios; CAGR 17% vs 34% del control
    fuente: '`reports/aggressive_v2_resultado.md`'
  - id: H9
    idea: Parabolic SAR como capa de salida y como señal (H9)
    motivo: >-
      Sprint extra (30-oct, a petición de Brandon): como filtro de salida no gana al control (Sharpe 1.14–1.20 contra
      1.19, bootstrap 0.35–0.50) y empeora la caída máxima 9–10 puntos (−44% contra −34%) porque sale en cada rebote
      fallido y recompra tarde, pagando 15–17% anual en costos contra 13%; como señal única rinde +17% anual contra +38%.
      No se vuelve a probar sin comisiones < 0.15% por lado
    fuente: '`reports/h9_parabolic_sar_resultado.md`'
  - id: C100
    idea: Catálogo 100 — 103 estrategias en 18 familias (momentum transversal y temporal, cruces, Donchian, baja vol, stops ATR, frenos, liquidez, repartos, SPY, altseason, calendario, reversión semanal, ensambles, ML, momentum dual, bandas, vol-régimen)
    motivo: >-
      Barrido preregistrado (30-oct): 2 fuera por costos, 101 al barrido, ninguna avanza; p global 0.69 (la mejor
      ventaja es la esperada por azar entre 101). Mejor por Sharpe: control-topk-2 (1.35) y donchian-55-20-equal (1.34,
      +53% anual con la mitad de rotación, pero su ventaja está en 2023 y p corregida 0.69). Cruces, tsmom, ML, calendario,
      reversión y momentum dual rinden claramente peor que el control. Las familias se reabren solo con un dato nuevo
      (p. ej. un carril hacia adelante)
    fuente: '`reports/catalogo100_resultado.md`'
  - id: C2
    idea: Catálogo 2 — 53 estrategias para el bloque de ETFs (mezclas, paridad de riesgo, tendencia, GEM, sectores, clases, vol objetivo, rebalanceo, duración del bono, freno)
    motivo: >-
      Barrido preregistrado (31-oct): ninguna supera al 60/40 tras la corrección (p global 0.72). 23 de 53 mejoran el Sharpe
      pero bajando rendimiento; las de más rendimiento (sectores +10.9%, GEM +9.9%) caen 35–50%. El timing en ETFs no paga
      ni con 0.05% de costo. Hallazgos que salen como hipótesis propias: H11 (banda 10 pp) y H12 (kill switch del bloque ETF)
    fuente: '`reports/catalogo2_etf_resultado.md`'
  - id: H1
    idea: Banda 4 pp + margen 15% (H1)
    motivo: >-
      Sprint 01: mejora todo (+2.7 pts de rendimiento anual, −1.8 pts de caída), pero bootstrap 0.81 <
      0.967. No concluyente; se replantea como H1b (recompras)
    fuente: '`reports/sprint01_costo_cripto_resultado.md`'
  - id: H3
    idea: Rebalanceo semanal (H3)
    motivo: >-
      Sprint 01: costo anual 4% contra 11%, pero 2022 −30% contra −14% y caída de 42–45%, en el límite del
      kill switch
    fuente: '`reports/sprint01_costo_cripto_resultado.md`'
  - idea: Arena intradía (scalping, swing, reversión, creación de mercado)
    motivo: >-
      Pierde por diseño con estas comisiones: la creación de mercado cobraba 0.10% por lado y pagaba 0.30%;
      el scalping necesitaba ~69% de aciertos. Resultado final −US$285.90 (−7.1%), US$164.70 en comisiones.
      Apagada el 25-oct
    fuente: DEC-030, DEC-031

bitacora:
  - sprint: '01'
    fecha: '2026-10-25'
    hipotesis: 'banda 4 pp + margen 15%, semanal, ambas (H1, H3)'
    ids: [H1, H3]
    resultado: >-
      Control +43% anual con 11% de costo; V1 mejor en todo, pero no concluyente; semanal más barato, pero
      con peores caídas
    decision: Se conserva el control. Siguen H4/H2 (abaratar cada operación)
    enlace: reports/sprint01_costo_cripto_resultado.md
  - sprint: '02'
    fecha: '2026-10-25'
    hipotesis: 'orden mínima US$20/25 (H2), efectivo con rendimiento (H8), órdenes maker (H4)'
    ids: [H2, H8, H4]
    resultado: >-
      H2 US$25 aprobada (+41.0% contra +36.2% anual, caída 2.9 puntos menor, bootstrap 0.971; ahorro de costo ≈1 punto,
      el resto es camino); H8 aprobada en backtest (+1.8 puntos) pero sin tasa real de plataforma; H4 sin veredicto
      por backtest (6 de 18 órdenes maker)
    decision: >-
      `min_order_value` 5 → 25 en el piloto cripto (DEC-033), revisión a 4 semanas. H8 se resuelve con el exchange (H7).
      H4: prueba hacia adelante con `wait_s` 300 propuesta a Brandon
    enlace: reports/sprint02_costo_ejecucion_resultado.md
  - sprint: 'H9'
    fecha: '2026-10-30'
    hipotesis: 'Parabolic SAR como filtro de salida (estándar y lento) y en lugar de la tendencia (H9)'
    ids: [H9]
    resultado: >-
      Ninguna variante aprobada: V1/V2 pasan placebo y Sharpe deflactado pero no ganan al control (bootstrap 0.35/0.50),
      pierden 4 y 3 de 6 años, caen −6/−3 puntos con costos de estrés y empeoran la caída máxima 9–10 puntos; V3
      falla los cinco criterios (+17% contra +38% anual)
    decision: >-
      Se conserva el control. H9 a descartadas. Sigue el orden del backlog: H1b (no recomprar en 48 h) en el sprint 03
      del 8-nov; filtro de liquidez/spread por moneda se propone como parte de H6
    enlace: reports/h9_parabolic_sar_resultado.md
  - sprint: 'C100'
    fecha: '2026-10-30'
    hipotesis: 'Catálogo 100: 103 estrategias en 18 familias contra el control, con compuerta de costos y corrección familiar'
    ids: [C100]
    resultado: >-
      Ninguna avanza: p global 0.69; 16 de 103 con Sharpe mayor que el control, ninguna con significancia. Donchian 55/20
      (+53% anual, Sharpe 1.34, rotación 16) y top 2 (+49%, 1.35) son las más cercanas; las familias de señal nueva
      (cruces, tsmom, ML, calendario, reversión, dual) rinden peor
    decision: >-
      Se conserva el control; 155 intentos acumulados para el Sharpe deflactado. Se propone a Brandon un carril de 4
      semanas para Donchian 55/20 (H10). Sigue H1b en el sprint 03
    enlace: reports/catalogo100_resultado.md
  - sprint: 'C2'
    fecha: '2026-10-31'
    hipotesis: 'Catálogo 2: 53 estrategias para el bloque de ETFs contra el 60/40'
    ids: [C2]
    resultado: >-
      Intento 1 inválido (kill switch desde 2008 mató al control; registrado). Intento 2: ninguna avanza, p global 0.72;
      el 60/40 habría tocado −25% en 2008 (−31% de caída). Banda 10 pp: +9.0% vs +8.5% con p sin corregir 0.01
    decision: >-
      Se conserva el 60/40. H11 (banda 10 pp, costo) y H12 (kill switch del bloque ETF, decisión de Brandon) al backlog.
      261 intentos acumulados
    enlace: reports/catalogo2_etf_resultado.md
