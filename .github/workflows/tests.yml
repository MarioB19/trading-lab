name: pruebas
on:
  push:
    paths: ["src/**", "tests/**", "pyproject.toml", "config.yaml", "requirements*.txt", ".github/workflows/tests.yml"]
  pull_request: {}
  workflow_dispatch: {}
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: requirements-dev.lock.txt
      - run: pip install -r requirements-dev.lock.txt && pip install --no-deps -e .
      - run: python -m pytest -q -W ignore
