# Corre el bot y la revisión en tiempo real, y guarda el estado en el repositorio.
# Sin secretos configurados todo es SIMULADO. Para dinero real ver README ("Pasar a real").
#   - Cada hora: revisión en tiempo real (lab.realtime) y, si hay una vela diaria nueva que no se
#     ha operado, la corrida diaria (lab.bot --if-due). Así, si GitHub se salta una corrida
#     programada, la siguiente hora la pone al día.
#   - 00:20 UTC = 18:20 hora del centro de México: corrida diaria tras el cierre (respaldo).
name: bot-diario
on:
  schedule:
    - cron: "20 0 * * *"
    - cron: "7 * * * *"
  workflow_dispatch: {}
permissions:
  contents: write
concurrency:
  group: bot
  cancel-in-progress: false
jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - run: git pull --rebase   # si esta corrida esperó en la cola, trae el estado más reciente
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: pyproject.toml
      # solo lo que usa el bot (sin scipy ni scikit-learn): la corrida por hora tarda menos
      - run: pip install "pandas>=2.1" "numpy>=1.26" "ccxt>=4.3" "pyyaml>=6.0" "requests>=2.31" && pip install -e . --no-deps
      - name: Correr el bot
        env:
          BITSO_API_KEY: ${{ secrets.BITSO_API_KEY }}
          BITSO_API_SECRET: ${{ secrets.BITSO_API_SECRET }}
          ALPACA_KEY_ID: ${{ secrets.ALPACA_KEY_ID }}
          ALPACA_SECRET_KEY: ${{ secrets.ALPACA_SECRET_KEY }}
          CONFIRMO_DINERO_REAL: ${{ vars.CONFIRMO_DINERO_REAL }}
        run: |
          if [ "$CONFIRMO_DINERO_REAL" = "si" ]; then
            python -m lab.bot --live --if-due
            python -m lab.realtime --once --live
          else
            python -m lab.bot --if-due
            python -m lab.realtime --once
          fi
      - name: Guardar estado
        if: always()
        run: |
          git config user.name "trading-lab-bot"
          git config user.email "trading-lab-bot@users.noreply.github.com"
          git add state/
          git commit -m "bot: $(date -u +'%F %H:%M') UTC" || { echo "sin cambios"; exit 0; }
          git pull --rebase
          git push
