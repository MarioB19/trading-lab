name: gcp-validate
on:
  pull_request:
    paths: ["infra/gcp/**", "scripts/gcp/**", "src/lab/**", "configs/experiments/**", "config.yaml", "Dockerfile", ".dockerignore", "requirements-runtime.txt", ".github/workflows/gcp*.yml"]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.10.5
      - run: bash scripts/gcp/validate.sh
      - run: docker build --build-arg SOURCE_SHA="$GITHUB_SHA" -t trading-lab:check .
      - run: docker run --rm --network none trading-lab:check python -c 'import lab.runtime,lab.service,lab.ops; from pathlib import Path; assert not Path("/app/state").exists(); assert not Path("/app/.env").exists()'
      - run: docker run --rm --network none trading-lab:check python -m lab.paper_comparison --describe
