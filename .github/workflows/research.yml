# Cada domingo descarga datos al día y vuelve a correr la investigación completa.
name: investigacion-semanal
on:
  schedule:
    - cron: "0 7 * * 0"    # domingo 07:00 UTC
  workflow_dispatch: {}
permissions:
  contents: write
concurrency:
  group: bot
  cancel-in-progress: false
jobs:
  research:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install -e .
      - run: python -W ignore -m lab.research_multi --refresh
      - run: |
          git config user.name "trading-lab-bot"
          git config user.email "trading-lab-bot@users.noreply.github.com"
          git add reports/multi_results.json reports/multi_informe.md reports/multi_curves.csv
          git commit -m "investigación: $(date -u +%F)" || { echo "sin cambios"; exit 0; }
          git pull --rebase
          git push
